<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="card p-4 shadow form-card">
        <h2 class="text-center mb-4">Profile</h2>

        <input type="number" id="age" class="form-control mb-3" placeholder="Age">
        <input type="date" id="dob" class="form-control mb-3">
        <input type="text" id="contact" class="form-control mb-3" placeholder="Contact">
        <input type="text" id="address" class="form-control mb-3" placeholder="Address">

        <button id="saveBtn" class="btn btn-warning w-100">Save Profile</button>
        <button id="logoutBtn" class="btn btn-danger w-100 mt-2">Logout</button>

        <p id="message" class="text-center mt-2"></p>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/profile.js"></script>

</body>
</html>
